# Netlify build + hosting configuration for the PNMS frontend (a static single-page app).
# Set VITE_API_URL (and the other VITE_* values from .env.example) in Netlify -> Site settings -> Environment variables.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# --- OPTIONAL "Option B": same-origin API proxy (most robust fix for the login 403 on *.netlify.app + *.onrender.com) ---
# Netlify (*.netlify.app) and Render (*.onrender.com) are different SITES, so the API session cookie is third-party and is
# dropped by Safari/iOS and by browsers that block third-party cookies, even with SameSite=None. To make it first-party:
#   1. Netlify env: leave VITE_API_URL EMPTY (and delete it from .env.production) so the app calls same-origin /api.
#   2. Uncomment the two rules below (they must stay BEFORE the SPA fallback).
#   3. Render env: keep FRONTEND_URL=<this Netlify origin>, COOKIE_SECURE=true, TRUST_PROXY=1; COOKIE_SAME_SITE=lax is then fine.
# Caveats (NOT VERIFIED at runtime): Netlify proxied requests time out after ~26 s (large exports may fail), and the API then
# sees Netlify's edge as the client IP, so per-IP rate limits (login/API) are shared - check TRUST_PROXY hop count/limits.
# [[redirects]]
#   from = "/api/*"
#   to = "https://pnms-backend.onrender.com/api/:splat"
#   status = 200
#   force = true
# [[redirects]]
#   from = "/health/*"
#   to = "https://pnms-backend.onrender.com/health/:splat"
#   status = 200
#   force = true

# Single-page-app fallback: any path that is not a real file serves index.html (deep links, refresh, /staff ...).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=63072000"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    # Strictest policy compatible with the bundle: no inline/eval scripts; inline styles are required by Tailwind/recharts;
    # connect-src allows any HTTPS API origin because the Railway URL is not known at build time - tighten it to
    # "'self' https://pnms-backend.onrender.com" once the final API domain is fixed.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://pnms-backend.onrender.com; worker-src 'self'; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

# The HTML shell must always be revalidated so users pick up new deployments.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"
