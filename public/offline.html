<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#165d48" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Connection required | PNMS</title>
    <style>
      html, body { margin: 0; min-height: 100%; font-family: "Segoe UI", Arial, sans-serif; background: #f6f8f6; color: #223a31; }
      main { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); }
      .card { max-width: 420px; background: #fff; border: 1px solid #e1e7e2; border-radius: 14px; padding: 32px 26px; text-align: center; }
      img { width: 150px; height: auto; margin-bottom: 18px; }
      h1 { font-size: 22px; margin: 0 0 10px; }
      p { font-size: 14px; line-height: 1.7; color: #52635a; margin: 0 0 22px; }
      button { min-height: 48px; padding: 0 26px; border: 0; border-radius: 8px; background: #165d48; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="card" role="alert">
        <img src="/images/clf-logo.webp" alt="ChildLife Foundation" />
        <h1>Connection required</h1>
        <p>
          PNMS needs an internet connection to protect patient information. Nothing is stored offline and no report
          has been submitted. Reconnect and try again.
        </p>
        <button type="button" id="retry">Try again</button>
      </div>
    </main>
      <script src="/offline.js"></script>
  </body>
</html>
